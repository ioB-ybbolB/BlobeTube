async function fetchRandomShortBatch(){

  const channelIds=[];
  const creatorKey=v=>channelIdFrom(v)||String(v.author||'').trim().toLowerCase();
  const accept=v=>{state.shortFeedSeen.add(v.videoId);batchCreators.add(creatorKey(v));gathered.push({...v,isShort:true})};

    const query=topic==='#shorts'?topic:`${topic} #shorts`;
    try{
      const d=await piped('/search?q='+encodeURIComponent(query)+'&filter=videos');
      const items=Array.isArray(d?.items)?d.items:[];

        const v=normalize(raw);

      }

  }

  // creator cannot flood the primary batch even if their tab returns many items.
